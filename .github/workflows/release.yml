name: release

on:
  push:
    tags: ["v*"]
  release:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: build + test
        run: |
          cargo build --release
          cargo test --release

      - name: install NSIS
        run: choco install nsis -y --no-progress

      - name: package
        shell: pwsh
        run: |
          Copy-Item target\release\ephe.exe installer\ephe.exe -Force
          Copy-Item Logo.png installer\Logo.png -Force
          Copy-Item text-logo.png installer\text-logo.png -Force
          New-Item -ItemType Directory -Path release -Force | Out-Null
          & "C:\Program Files (x86)\NSIS\makensis.exe" /INPUTCHARSET UTF8 /V2 installer\ephe.nsi
          Copy-Item Logo.png release\Logo.png -Force
          Copy-Item text-logo.png release\text-logo.png -Force
          Compress-Archive -Path target\release\ephe.exe, release\Logo.png, release\text-logo.png -DestinationPath release\ephe-portable.zip -Force
          $sums = foreach ($f in @("ephe-setup.exe", "ephe-portable.zip")) {
            (Get-FileHash "release\$f" -Algorithm SHA256).Hash.ToLower() + "  " + $f
          }
          Set-Content -Path release\SHA256SUMS -Value ($sums -join "`r`n" + "`r`n") -Encoding utf8

      - name: publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
            DRAFT="--draft"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            DRAFT=""
          else
            TAG="${{ github.ref_name }}"
            DRAFT=""
          fi
          ASSETS="release/ephe-setup.exe release/ephe-portable.zip release/Logo.png release/text-logo.png release/SHA256SUMS"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # release already exists (e.g. a draft made by hand) — attach assets, leave state as-is
            gh release upload "$TAG" $ASSETS --clobber
          else
            gh release create "$TAG" $ASSETS --title "ephe $TAG" $DRAFT --generate-notes
          fi
