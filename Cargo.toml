[package]
name = "ephe"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "temporary ephemeral text pad between desktop and phone, on the local network"
repository = "https://github.com/anomalyco/ephe"

[lib]
name = "ephe"
path = "src/lib.rs"

[[bin]]
name = "ephe"
path = "src/main.rs"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
winres = "0.1"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["ws", "http1", "query", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time", "test-util"] }
futures = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
local-ip-address = "0.6"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webbrowser = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
