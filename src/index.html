<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light dark">
  <title>ephe</title>
  <link rel="icon" href="/logo.png" type="image/png">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="role-desktop loading">
  <header class="topbar">
    <span class="brand"><img src="/text-logo.png" alt="ephe" width="88" height="20"></span>
    <div class="devices" id="devices" aria-label="connected phones"></div>
    <div class="topbar-actions">
      <button class="btn btn-sm" id="collapse-btn" type="button">hide qr</button>
      <button class="btn btn-sm top-undo" id="top-undo" type="button" disabled>undo</button>
      <button class="btn btn-sm top-redo" id="top-redo" type="button" disabled>redo</button>
      <button class="btn btn-sm top-copy" id="top-copy" type="button">copy</button>
      <button class="btn btn-sm top-paste" id="top-paste" type="button">paste</button>
      <button class="btn btn-sm top-clear" id="top-clear" type="button">clear</button>
      <button class="btn btn-sm lock-btn" id="top-lock" type="button">lock pad</button>
      <button class="btn btn-sm top-size" id="top-size-down" type="button" aria-label="decrease text size">A&minus;</button>
      <button class="btn btn-sm top-size" id="top-size-up" type="button" aria-label="increase text size">A+</button>
      <button class="btn btn-sm top-size-reset size-reset" id="top-size-reset" type="button" hidden>size reset</button>
      <button class="btn btn-sm top-history" id="top-history" type="button">history</button>
      <button class="btn btn-sm reset-btn top-reset" id="top-reset" type="button" hidden>start new session</button>
      <button class="btn btn-sm btn-icon" id="theme-btn" type="button" aria-label="switch theme">&#9788;</button>
      <span class="status" id="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span class="label" id="status-label">waiting</span>
      </span>
    </div>
  </header>

  <main id="app">
    <section class="qr-panel" id="qr-panel" aria-label="QR code">
      <div class="qr-card">
        <img id="qr" src="/qr" alt="" width="180" height="180" decoding="async">
      </div>
      <p class="hint" id="caption">scan to connect a phone</p>
      <div class="url-row" id="url-row" hidden>
        <input id="url-text" class="url-text" type="text" readonly aria-label="mobile link">
        <button class="btn btn-sm" id="copy-url-btn" type="button">copy link</button>
        <button class="btn btn-sm" id="share-btn" type="button" hidden>share</button>
      </div>
    </section>

    <section class="editor-panel">
      <p class="editor-hint" id="editor-hint" hidden></p>
      <textarea id="editor"
                spellcheck="false"
                autocapitalize="off"
                autocorrect="off"
                autocomplete="off"
                translate="no"
                inputmode="text"
                enterkeyhint="done"
                aria-label="shared text"></textarea>
      <footer class="footer">
        <p class="footer-hint" id="footer-hint">start typing — text syncs instantly</p>
        <div class="footer-actions">
          <button class="btn btn-sm undo-btn" id="undo-btn" type="button" disabled>undo</button>
          <button class="btn btn-sm redo-btn" id="redo-btn" type="button" disabled>redo</button>
          <button class="btn btn-sm" id="copy-btn" type="button">copy</button>
          <button class="btn btn-sm" id="paste-btn" type="button">paste</button>
          <button class="btn btn-sm" id="clear-btn" type="button">clear</button>
          <button class="btn btn-sm" id="size-down-btn" type="button" aria-label="decrease text size">A&minus;</button>
          <button class="btn btn-sm" id="size-up-btn" type="button" aria-label="increase text size">A+</button>
          <button class="btn btn-sm size-reset" id="size-reset-btn" type="button" hidden>size reset</button>
          <button class="btn btn-sm reset-btn" id="reset-btn" type="button" hidden>start new session</button>
        </div>
        <p class="footer-count" id="footer-count">0 chars · 0 words</p>
      </footer>
    </section>
  </main>

  <div class="history-panel" id="history-panel" hidden>
    <div class="history-card" role="dialog" aria-label="history">
      <h2 class="history-title">history</h2>
      <p class="history-empty" id="history-empty">nothing to show yet — start typing</p>
      <ul class="history-list" id="history-list"></ul>
      <button class="btn btn-sm" id="history-close" type="button">close</button>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
