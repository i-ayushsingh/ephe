<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light dark">
  <title>ephe</title>
  <link rel="icon" href="/logo.png" type="image/png">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="role-desktop loading">
  <header class="topbar">
    <span class="brand"><img src="/text-logo.png" alt="ephe" width="88" height="20"></span>
    <div class="devices" id="devices" aria-label="connected phones"></div>
    <div class="topbar-actions">
      <button class="btn btn-sm" id="collapse-btn" type="button">hide qr</button>
      <button class="btn btn-sm lock-btn" id="lock-btn" type="button">lock pad</button>
      <button class="btn btn-sm" id="history-btn" type="button">history</button>
      <button class="btn btn-sm btn-icon" id="theme-btn" type="button" aria-label="switch theme">&#9788;</button>
      <span class="status" id="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span class="label" id="status-label">waiting</span>
      </span>
    </div>
  </header>

  <main id="app">
    <section class="qr-panel" id="qr-panel" aria-label="QR code">
      <div class="qr-card">
        <img id="qr" src="/qr" alt="QR code — scan with phone to connect" width="180" height="180" decoding="async">
      </div>
      <p class="hint" id="caption">scan to connect a phone</p>
      <div class="url-row" id="url-row" hidden>
        <input id="url-text" class="url-text" type="text" readonly aria-label="mobile link">
        <button class="btn btn-sm" id="copy-url-btn" type="button">copy link</button>
        <button class="btn btn-sm" id="share-btn" type="button" hidden>share</button>
      </div>
    </section>

    <section class="editor-panel">
      <p class="editor-hint" id="editor-hint" hidden></p>
      <textarea id="editor"
                spellcheck="false"
                autocapitalize="off"
                autocorrect="off"
                autocomplete="off"
                translate="no"
                inputmode="text"
                enterkeyhint="done"
                aria-label="shared text"></textarea>
      <footer class="footer">
        <p class="footer-hint" id="footer-hint">start typing — text syncs instantly</p>
        <div class="footer-actions">
          <button class="btn btn-sm undo-btn" id="undo-btn" type="button" disabled aria-label="undo">&#8630; <span class="btn-txt">undo</span></button>
          <button class="btn btn-sm" id="copy-btn" type="button">copy</button>
          <button class="btn btn-sm transform-btn" id="transform-btn" type="button" aria-label="transform menu">transform</button>
          <button class="btn btn-sm" id="paste-btn" type="button">paste</button>
          <button class="btn btn-sm redo-btn" id="redo-btn" type="button" disabled aria-label="redo">&#8631; <span class="btn-txt">redo</span></button>
          <button class="btn btn-sm" id="clear-btn" type="button">clear</button>
          <button class="btn btn-sm" id="size-down-btn" type="button" aria-label="decrease text size">A&minus;</button>
          <button class="btn btn-sm" id="size-up-btn" type="button" aria-label="increase text size">A+</button>
          <button class="btn btn-sm size-reset" id="size-reset-btn" type="button" hidden>size reset</button>
          <button class="btn btn-sm font-toggle" id="font-btn" type="button">font: system</button>
          <button class="btn btn-sm wrap-toggle" id="wrap-btn" type="button">wrap on</button>
          <button class="btn btn-sm shortcuts-btn" id="shortcuts-btn" type="button" aria-label="keyboard shortcuts">keys</button>
          <button class="btn btn-sm reset-btn" id="reset-btn" type="button" hidden>start new session</button>
        </div>
        <p class="footer-count" id="footer-count">0 chars · 0 words · 0 lines</p>
      </footer>
    </section>
  </main>

  <div class="transform-panel" id="shortcuts-panel" hidden>
    <div class="transform-card" role="dialog" aria-modal="true" aria-labelledby="shortcuts-title">
      <h2 class="transform-title" id="shortcuts-title">shortcuts</h2>
      <ul class="shortcuts-list">
        <li><kbd>Ctrl</kbd>+<kbd>A</kbd> select all</li>
        <li><kbd>Ctrl</kbd>+<kbd>C</kbd> copy</li>
        <li><kbd>Ctrl</kbd>+<kbd>V</kbd> paste</li>
        <li><kbd>Ctrl</kbd>+<kbd>Z</kbd> undo</li>
        <li><kbd>Ctrl</kbd>+<kbd>Y</kbd> redo</li>
      </ul>
      <button class="btn btn-sm" id="shortcuts-close" type="button">close</button>
    </div>
  </div>

  <div class="transform-panel" id="transform-panel" hidden>
    <div class="transform-card" role="dialog" aria-modal="true" aria-labelledby="transform-title">
      <h2 class="transform-title" id="transform-title">transform</h2>
      <div class="transform-list" id="transform-list"></div>
      <button class="btn btn-sm" id="transform-close" type="button">close</button>
    </div>
  </div>

  <div class="history-panel" id="history-panel" hidden>
    <div class="history-card" role="dialog" aria-modal="true" aria-labelledby="history-title">
      <h2 class="history-title" id="history-title">history</h2>
      <p class="history-empty" id="history-empty">nothing to show yet — start typing</p>
      <ul class="history-list" id="history-list"></ul>
      <button class="btn btn-sm" id="history-close" type="button">close</button>
    </div>
  </div>

  <div class="transform-panel" id="paste-panel" hidden>
    <div class="transform-card" role="dialog" aria-modal="true" aria-labelledby="paste-title">
      <h2 class="transform-title" id="paste-title">paste text</h2>
      <textarea id="paste-input" class="paste-input" rows="4" placeholder="paste text here..." aria-label="paste text input"></textarea>
      <div class="modal-actions">
        <button class="btn btn-sm" id="paste-submit" type="button">insert</button>
        <button class="btn btn-sm" id="paste-close" type="button">cancel</button>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
